name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Linux (GCC)
            os: ubuntu-latest
          - name: macOS (Clang / Accelerate)
            os: macos-latest
          - name: Windows (MSVC / CUDA-or-CPU)
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: E2E Training Smoke Test
        shell: bash
        run: |
          if [ -f "./build/Release/perfectdou_train.exe" ]; then
            ./build/Release/perfectdou_train.exe --updates 2 --games 16 --mb 64 --epochs 2 --threads 2 --pool-every 1
          elif [ -f "./build/Release/perfectdou_train" ]; then
            ./build/Release/perfectdou_train --updates 2 --games 16 --mb 64 --epochs 2 --threads 2 --pool-every 1
          else
            ./build/perfectdou_train --updates 2 --games 16 --mb 64 --epochs 2 --threads 2 --pool-every 1
          fi

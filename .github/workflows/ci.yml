name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Linux (GCC)
            os: ubuntu-latest
          - name: macOS (Clang / Accelerate)
            os: macos-latest
          - name: Windows (MSVC / CUDA-or-CPU)
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: E2E Training Smoke Test
        shell: bash
        run: |
          TRAIN_BIN="./build/perfectdou_train"
          if [ -f "./build/Release/perfectdou_train.exe" ]; then
            TRAIN_BIN="./build/Release/perfectdou_train.exe"
          elif [ -f "./build/Release/perfectdou_train" ]; then
            TRAIN_BIN="./build/Release/perfectdou_train"
          fi
          $TRAIN_BIN --updates 2 --games 16 --mb 64 --epochs 2 --threads 2 --pool-every 1 \
            --eval-every 1 --eval-decks 1 --eval-port 19999 \
            --eval-save-dir build/ci_eval_snapshots --eval-csv build/ci_eval.csv

          # Verify evaluation model snapshots were written to disk
          test -d build/ci_eval_snapshots/u1
          test -f build/ci_eval_snapshots/u1/actor0.bin
          test -f build/ci_eval_snapshots/u1/meta.txt
          python3 -m py_compile tools/plot_eval.py
